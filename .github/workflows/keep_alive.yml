name: Keep Streamlit App Alive

on:
  schedule:
    # Run every 2 days at 09:00 UTC
    - cron: '0 9 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          echo "Pinging Streamlit Cloud app to prevent sleep mode..."
          curl -s -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "https://contract-monitor-qzrddgkj8hzsn8h5upggmr.streamlit.app" > /dev/null
          echo "Successfully pinged at $(date)"
